<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cartlight</title>
    <script>
      // Apply the saved theme and direction before first paint, so there is no flash.
      ;(function () {
        try {
          var d = document.documentElement
          var t = localStorage.getItem('cartlight.theme')
          if (t !== 'light' && t !== 'dark' && t !== 'holiday') {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          d.dataset.theme = t
          if (localStorage.getItem('cartlight.dir') === 'rtl') {
            d.dir = 'rtl'
            d.lang = 'ar'
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
